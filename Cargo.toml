[package]
name = "limitcue"
version = "0.2.0"
edition = "2021"
description = "Always-on-top notch for AI coding subscriptions — see remaining usage for Claude, Codex, Grok, MiniMax, Kimi and more, right on your desktop."
license = "MIT"
repository = "https://github.com/San-77x/limitcue"
homepage = "https://github.com/San-77x/limitcue"
readme = "README.md"
rust-version = "1.95"
keywords = ["quota", "usage", "ai", "desktop", "linux"]
categories = ["gui", "command-line-utilities", "development-tools"]

# What ships to crates.io: the source and the assets the binary embeds. The
# web app, packaging, docs, screenshots and the full (unsubsetted) font
# originals are repository-only.
exclude = [
    "/.github",
    "/docs",
    "/packaging",
    "/scripts",
    "/web",
    "/assets/screenshots",
    "/assets/fonts/Inter-Regular.ttf",
    "/assets/fonts/Inter-Medium.ttf",
    "/assets/fonts/Inter-SemiBold.ttf",
    "/assets/fonts/Hack-Regular.ttf",
]

# Prebuilt-install metadata for `cargo binstall limitcue`. The release asset
# is Linux x86_64 only, which is the only target shipped today.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/limitcue-linux-x86_64.tar.gz"
pkg-fmt = "tgz"
bin-dir = "."

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }
png = "0.17"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zbus = { version = "5", features = ["blocking"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
panic = "abort"
