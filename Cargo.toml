[package]
name = "limitcue"
version = "0.1.0"
edition = "2021"
description = "Floating quota pill for AI coding subscriptions — see remaining usage for Claude, Codex, MiniMax, Kimi, OpenCode Go and more, right on your desktop."
license = "MIT"
repository = "https://github.com/San-77x/limitcue"
readme = "README.md"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
dirs = "5"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
