[package]
name = "limitcue"
version = "0.1.0"
edition = "2021"
description = "Floating quota pill for AI coding subscriptions — see remaining usage for Claude, Codex, Grok, MiniMax, Kimi and more, right on your desktop."
license = "MIT"
repository = "https://github.com/San-77x/limitcue"
homepage = "https://github.com/San-77x/limitcue"
readme = "README.md"
rust-version = "1.95"
keywords = ["quota", "usage", "ai", "desktop", "linux"]
categories = ["gui", "command-line-utilities", "development-tools"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }
png = "0.17"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zbus = { version = "5", features = ["blocking"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
panic = "abort"
