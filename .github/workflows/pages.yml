name: pages

# Builds the static landing page under web/ and publishes it to GitHub Pages.
# The app is served from /<repo>/ on a project site, so the base path is
# derived from the repository name. If a custom domain is added later, set
# NEXT_PUBLIC_BASE_PATH to an empty string instead.
on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pages is not available for private repositories on the free plan, so the
    # push trigger stays quiet until the repository is public. A manual run
    # still works once Pages is configured.
    if: github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - uses: actions/configure-pages@v6
        with:
          # Enables Pages on the first run after the repository is public,
          # so no manual settings change is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
