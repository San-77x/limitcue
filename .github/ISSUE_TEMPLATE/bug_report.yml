name: Bug report
description: Something is broken or behaves in a way you did not expect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys, tokens, or
        credential files — redact them first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LimitCue version or commit
      placeholder: e.g. v0.1.0, or the output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Display session
      options:
        - KDE Plasma — Wayland
        - KDE Plasma — X11
        - GNOME — Wayland
        - GNOME — X11
        - Other compositor / X11
    validations:
      required: true
  - type: dropdown
    id: providers
    attributes:
      label: Which provider is affected?
      multiple: true
      options:
        - Claude
        - ChatGPT / Codex
        - Grok / xAI
        - MiniMax
        - Kimi For Coding
        - New-API gateway (AgentRouter etc.)
        - Custom JSON provider
        - Not provider-specific
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: |
        `limitcue --once` or `limitcue --json` output, or terminal logs.
        Redact anything sensitive.
      render: shell
    validations:
      required: false
